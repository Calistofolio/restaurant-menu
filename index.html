<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="stylesheet" href="src/style/index.scss">
  <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  
  <title>Product list with cart</title>

  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <h1 class="pt-[70px] pb-[20px] mx-[80px] text-3xl">Desserts</h1>
  <main class="px-20 flex justify-between">
    <ul id="product-list" class="grid grid-cols-3 gap-10">
  
    </ul>

  <div id="your-cart" class="flex flex-col h-fit w-96 p-10 rounded-[10px]">
    <h2 class="text-2xl font-semibold mb-5">Your Cart (<span id="total-quantity">0</span>)</h2>
    <ul id="cart-product"></ul>
    <div class="my-5">Order total <span id="total-value" class="text-end text-3xl font-bold">$0.00</span></div>
    <div class="text-center p-3 rounded" id="delivery-information">This is a <strong>carbon-neutral</strong> delivery</div> 
    <button type="button" id="open-modal" class="p-2 mt-4 rounded-3xl font-semibold bg-color-primary text-background-color">Confirm Order</button>
</div> 
</main>
<div id="modal" class="inset-0 bg-color-secondary fixed bg-opacity-50 justify-center items-center hidden z-50">
  <div class="flex justify-center items-center w-full h-full ">
    <div class="bg-background-color w-1/2 p-8 rounded">
      <i class="fa fa-check-circle-o fa-4x" aria-hidden="true"></i>
      <h2 class="text-5xl font-bold text-color-secondary">Order Confirmed</h2>
      <p class="text-color-tertiary">We hope you enjoy your food!</p>
      <div class="my-5">Order total <span id="total-value-modal" class="text-end text-3xl font-bold">$0.00</span></div>
      <button id="close-modal" class="p-4 mt-4 w-full rounded-[27px] font-semibold bg-color-primary text-background-color">Start new order</button>
    </div>
  </div>
</div>

<script type="module" src="./src/app.ts"></script>
</div>
    

 

 
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Luana Calisto</a>.
  </div>
</body>
</html>
